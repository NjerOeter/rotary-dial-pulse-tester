<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:34px;font-weight:700}.label{font-size:24px}.small{font-size:20px}.wire{stroke:#111;stroke-width:4;fill:none}.box{fill:#f5f5f5;stroke:#111;stroke-width:3}.warn{fill:#fff3cd;stroke:#8a6d3b;stroke-width:2}</style><text x="40" y="50" class="title">Rotary dial pulse contact to Raspberry Pi</text><rect x="50" y="110" width="270" height="250" rx="18" class="box"/><text x="90" y="155" class="label">Raspberry Pi</text><text x="85" y="225" class="small">Pin 11</text><text x="85" y="255" class="label">GPIO17</text><text x="85" y="315" class="small">Pin 9</text><text x="85" y="345" class="label">GND</text><line x1="220" y1="245" x2="410" y2="245" class="wire"/><rect x="410" y="212" width="120" height="66" rx="10" class="box"/><text x="442" y="253" class="label">1 kOhm</text><line x1="530" y1="245" x2="660" y2="245" class="wire"/><circle cx="690" cy="245" r="8" fill="#111"/><circle cx="810" cy="245" r="8" fill="#111"/><line x1="697" y1="240" x2="792" y2="197" class="wire"/><text x="645" y="165" class="label">Rotary pulse contact</text><text x="681" y="305" class="small">nsi / dry contact</text><line x1="810" y1="245" x2="890" y2="245" class="wire"/><line x1="890" y1="245" x2="890" y2="330" class="wire"/><line x1="890" y1="330" x2="220" y2="330" class="wire"/><rect x="50" y="405" width="900" height="75" rx="12" class="warn"/><text x="75" y="438" class="small">Disconnect the telephone from the FRITZ!Box / phone line first.</text><text x="75" y="468" class="small">Never connect GPIO directly to a live analog telephone line or a/b pair.</text></svg>