<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><style>text{font-family:Arial,sans-serif;fill:#111}.title{font-size:34px;font-weight:700}.label{font-size:24px}.small{font-size:20px}.sig{stroke:#111;stroke-width:5;fill:none}.guide{stroke:#888;stroke-width:2;stroke-dasharray:8 8}</style><text x="40" y="50" class="title">Example: rotary dial digit 4</text><text x="40" y="135" class="label">Contact closed</text><text x="40" y="265" class="label">Contact open</text><path class="sig" d="M 240 130 L 300 130 L 300 260 L 355 260 L 355 130 L 410 130 L 410 260 L 465 260 L 465 130 L 520 130 L 520 260 L 575 260 L 575 130 L 630 130 L 630 260 L 685 260 L 685 130 L 820 130"/><text x="295" y="350" class="small">1</text><text x="405" y="350" class="small">2</text><text x="515" y="350" class="small">3</text><text x="625" y="350" class="small">4</text><text x="250" y="395" class="small">Typical target: about 10 pulse cycles per second</text></svg>